<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <rect width="512" height="512" fill="#1a1a2a"/>
  <!-- Isometric grass cube -->
  <g transform="translate(256,90)">
    <!-- Top face -->
    <polygon points="0,0 180,90 0,180 -180,90" fill="#7cba3a" stroke="#2a4a18" stroke-width="3"/>
    <!-- Right face (dirt) -->
    <polygon points="0,180 180,90 180,300 0,390" fill="#8b5a2b" stroke="#3a2810" stroke-width="3"/>
    <!-- Left face (dirt) -->
    <polygon points="0,180 -180,90 -180,300 0,390" fill="#6e4520" stroke="#3a2810" stroke-width="3"/>
    <!-- Top speckles (grass tufts) -->
    <g fill="#5a8c25" opacity="0.6">
      <rect x="-40" y="50" width="14" height="14"/>
      <rect x="40" y="80" width="14" height="14"/>
      <rect x="-90" y="100" width="14" height="14"/>
      <rect x="80" y="120" width="14" height="14"/>
      <rect x="-20" y="140" width="14" height="14"/>
    </g>
    <!-- Right speckles -->
    <g fill="#5a3915" opacity="0.6">
      <rect x="40" y="220" width="14" height="14"/>
      <rect x="100" y="200" width="14" height="14"/>
      <rect x="60" y="280" width="14" height="14"/>
      <rect x="130" y="260" width="14" height="14"/>
    </g>
    <!-- Left speckles -->
    <g fill="#3a2810" opacity="0.5">
      <rect x="-60" y="220" width="14" height="14"/>
      <rect x="-120" y="200" width="14" height="14"/>
      <rect x="-80" y="280" width="14" height="14"/>
      <rect x="-150" y="260" width="14" height="14"/>
    </g>
  </g>
  <text x="256" y="490" text-anchor="middle" font-family="Verdana,sans-serif" font-size="36" font-weight="bold" fill="#ffffff">VoxelCraft</text>
</svg>
